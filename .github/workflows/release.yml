name: Release

# Push a tag like v1.18.0 to build every artifact and publish a GitHub release.
# Running it manually (Actions > Release > Run workflow) only builds and uploads the artifacts.
#
# Code signing (SignPath Foundation, see .signpath/README.md) switches on automatically once the
# SIGNPATH_API_TOKEN secret and SIGNPATH_ORGANIZATION_ID variable are set. Until then releases are unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = ([xml](Get-Content PinnyNotes.WpfUi/PinnyNotes.WpfUi.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build artifacts
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload unsigned artifacts
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: PinnyNotes-${{ steps.version.outputs.version }}-unsigned
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.msi

      - name: Sign with SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PinnyNotes' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use signed artifacts
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          Remove-Item dist -Recurse -Force
          Move-Item signed dist

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Exclude SHA256SUMS.txt | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern '^## v${{ steps.version.outputs.version }}\b' | Select-Object -First 1).LineNumber
          $notes = @()
          if ($start) {
            foreach ($line in $lines[$start..($lines.Count - 1)]) {
              if ($line -match '^## ') { break }
              $notes += $line
            }
          }
          $download = @(
            '',
            '### Downloads',
            '| File | What it is |',
            '| --- | --- |',
            '| `PinnyNotes-Setup-<version>-x64.msi` | Installer, adds a Start menu shortcut. |',
            '| `PinnyNotes-<version>-x64.exe` | Single exe, just download and run. Notes are saved to `%AppData%\Pinny Notes`. |',
            '| `PinnyNotes-Portable-<version>-x64.zip` | Portable, notes are saved next to the exe. Good for USB sticks. |',
            '',
            'Use the `arm64` files on Windows on ARM devices. No .NET install is needed for any of them.'
          ) -replace '<version>', '${{ steps.version.outputs.version }}'
          ($notes + $download) -join "`n" | Set-Content release-notes.md -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: PinnyNotes-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Pinny Notes v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
