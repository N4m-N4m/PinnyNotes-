<!doctype html>
<html><head><meta charset="utf-8"><title>Pinny Notes keyart</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; color: #f2f0ec; background: #0f0f11; position: relative; }
  .copy { position: absolute; left: 76px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; font-size: 20px; font-weight: 600; }
  .brand img { width: 40px; height: 40px; border-radius: 9px; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  h1 { font-size: 66px; line-height: 1.04; font-weight: 700; letter-spacing: -.025em; }
  h1 mark { background: none; color: #141414; position: relative; white-space: nowrap; }
  h1 mark::before { content: ""; position: absolute; left: -10px; right: -12px; top: 6px; bottom: -4px; z-index: -1;
                    background: #FEEA00; border-radius: 3px 8px 4px 10px; transform: rotate(-1deg); }
  p.tag { margin-top: 24px; font-size: 21px; line-height: 1.45; color: #b3aea6; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  p.meta { margin-top: 30px; font-size: 15px; color: #7d7972; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; letter-spacing: .01em; }
  .win { position: absolute; border-radius: 8px; overflow: hidden;
         box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.07); }
  .win img { display: block; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="img/icon.svg" alt="">Pinny Notes</div>
    <h1>Sticky notes that stay <mark>on top.</mark></h1>
    <p class="tag">Pin a note above any window. Find every note again in a searchable list. Fix up text with 19&nbsp;built&#8209;in&nbsp;tools.</p>
    <p class="meta">Free and open source &nbsp;·&nbsp; Windows 10 &amp; 11 &nbsp;·&nbsp; x64 &amp; ARM64</p>
  </div>

  <div class="win" style="left:886px; top:40px; z-index:1"><img src="img/dark-Notes-78-78.png"></div>
  <div class="win" style="left:600px; top:84px; z-index:3"><img src="img/dark-note-120-120.png"></div>
  <div class="win" style="left:668px; top:338px; z-index:4"><img src="img/dark-note-460-120.png"></div>
  <div class="win" style="left:1000px; top:430px; z-index:5"><img src="img/dark-note-820-120.png"></div>
</body></html>
