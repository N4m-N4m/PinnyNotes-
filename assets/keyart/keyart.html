<!doctype html>
<html><head><meta charset="utf-8"><title>Pinny Notes keyart</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
    color: #f4f4f5;
    background:
      radial-gradient(520px 420px at 78% 18%, rgba(254,234,0,.22), transparent 70%),
      radial-gradient(480px 420px at 92% 88%, rgba(17,149,221,.26), transparent 70%),
      radial-gradient(420px 360px at 52% 100%, rgba(167,41,149,.22), transparent 70%),
      radial-gradient(500px 400px at 0% 0%, rgba(98,91,184,.25), transparent 70%),
      #17171c;
    position: relative;
  }
  body::after { /* fine dot grid */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .brand img { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .brand span { font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: #a1a1aa; font-weight: 600; }
  h1 { font-size: 64px; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #FEEA00, #FFAB00); -webkit-background-clip: text; color: transparent; }
  p.tag { margin-top: 18px; font-size: 22px; line-height: 1.35; color: #d4d4d8; font-weight: 400; }
  .chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; font-size: 15px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: #e4e4e7; }
  .chip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }

  .win { position: absolute; border-radius: 8px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.06); }
  .win img { display: block; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="img/icon.svg" alt=""><span>Pinny Notes</span></div>
    <h1>Sticky notes<br>that <em>stay on top.</em></h1>
    <p class="tag">A fresh, Fluent take on Pinny Notes for Windows&nbsp;11, with rounded notes, a searchable notes list and 19&nbsp;text&nbsp;tools.</p>
    <div class="chips">
      <span class="chip"><i style="background:#FEEA00"></i>Pin above any window</span>
      <span class="chip"><i style="background:#1195DD"></i>Notes list &amp; search</span>
      <span class="chip"><i style="background:#E33036"></i>Light &amp; dark</span>
      <span class="chip"><i style="background:#AACC04"></i>Portable .exe</span>
    </div>
  </div>

  <div class="win" style="left:886px; top:40px; z-index:1"><img src="img/dark-Notes-78-78.png"></div>
  <div class="win" style="left:600px; top:84px; z-index:3"><img src="img/light-note-120-120.png"></div>
  <div class="win" style="left:668px; top:338px; z-index:4"><img src="img/light-note-460-120.png"></div>
  <div class="win" style="left:1000px; top:430px; z-index:5"><img src="img/light-note-820-120.png"></div>
</body></html>
