<!doctype html>
<html><head><meta charset="utf-8"><title>Pinny Notes scene</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { position: relative; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  body.light { background: #efebe3; }
  body.dark { background: #0f0f11; }
  .win { position: absolute; border-radius: 8px; overflow: hidden;
         box-shadow: 0 1px 2px rgba(40,30,10,.12), 0 12px 32px rgba(40,30,10,.16); }
  .dark .win { box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06); }
  .win img { display: block; }
</style></head>
<body>
<script>
  const m = new URLSearchParams(location.search).get('mode') || 'light';
  document.body.className = m;
  const wins = [
    ['note-120-120', 60, 50, 2], ['note-460-120', 400, 50, 2],
    ['note-120-440', 60, 370, 3], ['note-460-440', 400, 360, 3],
    ['note-820-120', 250, 500, 4],
    [m === 'dark' ? 'Notes-78-78' : 'Notes-52-52', 850, 80, 1],
  ];
  for (const [img, x, y, z] of wins) {
    const d = document.createElement('div');
    d.className = 'win'; d.style.cssText = `left:${x}px;top:${y}px;z-index:${z}`;
    d.innerHTML = `<img src="img/${m}-${img}.png">`;
    document.body.appendChild(d);
  }
</script>
</body></html>
