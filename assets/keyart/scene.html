<!doctype html>
<html><head><meta charset="utf-8"><title>Pinny Notes scene</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { position: relative; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  body.light { background:
      radial-gradient(700px 500px at 85% 15%, #c9dcff, transparent 70%),
      radial-gradient(600px 500px at 10% 90%, #ffe7c2, transparent 70%),
      radial-gradient(800px 600px at 50% 50%, #eef1f8, transparent 80%), #dfe6f3; }
  body.dark { background:
      radial-gradient(700px 500px at 85% 15%, rgba(17,149,221,.35), transparent 70%),
      radial-gradient(600px 500px at 10% 95%, rgba(167,41,149,.30), transparent 70%),
      radial-gradient(600px 500px at 45% 40%, rgba(98,91,184,.22), transparent 70%), #121218; }
  .win { position: absolute; border-radius: 8px; overflow: hidden;
         box-shadow: 0 18px 48px rgba(0,0,0,.28), 0 3px 10px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.06); }
  .dark .win { box-shadow: 0 22px 56px rgba(0,0,0,.6), 0 3px 12px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.07); }
  .win img { display: block; }
</style></head>
<body>
<script>
  const m = new URLSearchParams(location.search).get('mode') || 'light';
  document.body.className = m;
  const wins = [
    ['note-120-120', 60, 50, 2], ['note-460-120', 400, 50, 2],
    ['note-120-440', 60, 370, 3], ['note-460-440', 400, 360, 3],
    ['note-820-120', 250, 500, 4],
    [m === 'dark' ? 'Notes-78-78' : 'Notes-52-52', 850, 80, 1],
  ];
  for (const [img, x, y, z] of wins) {
    const d = document.createElement('div');
    d.className = 'win'; d.style.cssText = `left:${x}px;top:${y}px;z-index:${z}`;
    d.innerHTML = `<img src="img/${m}-${img}.png">`;
    document.body.appendChild(d);
  }
</script>
</body></html>
